<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Cinémathèque - Top 120 (1990 - 2026)</title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #181b22;
            --bg-hover: #222630;
            --accent: #e50914;
            --gold: #f5c518;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d323e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, #1a1d26 0%, var(--bg-main) 100%);
            padding: 40px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--gold);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Onglets Décennies */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* Barre de filtres */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--bg-card);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        input, select {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        /* Barre de statistiques */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats-bar strong {
            color: var(--text-main);
        }

        /* Grille de films */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-3px);
            border-color: #4b5563;
            background: var(--bg-hover);
        }

        .movie-card.masterpiece {
            border-left: 4px solid var(--gold);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .movie-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .movie-year {
            background: #272b36;
            color: var(--gold);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .movie-director {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .movie-genre {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 9px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: #d1d5db;
            margin-bottom: 15px;
            width: fit-content;
        }

        .ratings {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .rating-box {
            display: flex;
            flex-direction: column;
        }

        .rating-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .my-score {
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
        }

        .spec-score {
            color: #60a5fa;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .rate-badge {
            background: #10b98122;
            color: #34d399;
            border: 1px solid #10b98155;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 10px;
        }
    </style>
</head>

    ];

    let currentDecade = "ALL";

    const grid = document.getElementById("moviesGrid");
    const searchInput = document.getElementById("searchInput");
    const genreFilter = document.getElementById("genreFilter");
    const noteFilter = document.getElementById("noteFilter");
    const sortSelect = document.getElementById("sortSelect");
    const countDisplay = document.getElementById("countDisplay");
    const avgDisplay = document.getElementById("avgDisplay");
    const tabBtns = document.querySelectorAll(".tab-btn");

    function formatNum(num) {
        return num.toString().replace(".", ",");
    }

    function renderMovies() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const selectedGenre = genreFilter.value;
        const minNote = parseFloat(noteFilter.value);
        const sortBy = sortSelect.value;

        let filtered = movies.filter(movie => {
            const matchDecade = currentDecade === "ALL" || movie.decade === currentDecade;
            const matchGenre = selectedGenre === "ALL" || movie.genre === selectedGenre;
            const matchNote = movie.myNote >= minNote;
            const matchSearch = movie.title.toLowerCase().includes(searchTerm) ||
                                movie.director.toLowerCase().includes(searchTerm);
            return matchDecade && matchGenre && matchNote && matchSearch;
        });

        // Tri
        filtered.sort((a, b) => {
            if (sortBy === "year-asc") return a.year - b.year;
            if (sortBy === "year-desc") return b.year - a.year;
            if (sortBy === "my-desc") return b.myNote - a.myNote || b.specNote - a.specNote;
            if (sortBy === "spec-desc") return b.specNote - a.specNote || b.myNote - a.myNote;
            if (sortBy === "title-asc") return a.title.localeCompare(b.title);
            return 0;
        });

        // Mise à jour stats
        countDisplay.innerHTML = `Affichage de <strong>${filtered.length}</strong> film${filtered.length > 1 ? 's' : ''}`;
        if (filtered.length > 0) {
            const avg = (filtered.reduce((acc, m) => acc + m.myNote, 0) / filtered.length).toFixed(2);
            avgDisplay.innerHTML = `Moyenne perso : <strong>${formatNum(avg)} / 5</strong>`;
        } else {
            avgDisplay.innerHTML = `Moyenne perso : <strong>-</strong>`;
        }

        // Génération HTML
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">Aucun film ne correspond à vos critères de recherche.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(movie => `
            <div class="movie-card ${movie.myNote === 5 ? 'masterpiece' : ''}">
                <div>
                    <div class="card-header">
                        <div class="movie-title">${movie.title}</div>
                        <span class="movie-year">${movie.year}</span>
                    </div>
                    <div class="movie-director">🎬 ${movie.director}</div>
                    <div class="movie-genre">${movie.genre}</div>
                </div>
                <div class="ratings">
                    <div class="rating-box">
                        <span class="rating-label">Ma Note</span>
                        <span class="my-score">★ ${formatNum(movie.myNote)} / 5</span>
                    </div>
                    ${movie.rate ? `<span class="rate-badge">Rate ${movie.rate}</span>` : ''}
                    <div class="rating-box" style="text-align: right;">
                        <span class="rating-label">Spectateurs</span>
                        <span class="spec-score">${formatNum(movie.specNote.toFixed(1))} / 5</span>
                    </div>
                </div>
            </div>
        `).join("");
    }

    // Événements onglets
    tabBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            tabBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentDecade = btn.dataset.decade;
            renderMovies();
        });
    });

    // Événements filtres
    searchInput.addEventListener("input", renderMovies);
    genreFilter.addEventListener("change", renderMovies);
    noteFilter.addEventListener("change", renderMovies);
    sortSelect.addEventListener("change", renderMovies);

    // Initialisation
    renderMovies();
</script>
